<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            background: blue;
            grid-template-columns: 200x 1fr 1fr;
            grid-template-rows: 100px 200px 200px 100px;
            gap: 10px;
        }
        .box1{
            grid-column: 1/4;
            grid-row : 1;
            background: red ;
        }
        .box2{
            grid-column:1;
            grid-row: 2/4;
            background-color: red;
        }
        .box3{
            grid-column : 2;
            grid-row: 2;
            background-color: red;
        }
        .box4{
            grid-column: 2/4;
            grid-row: 3;
            background-color: red;
        }
        .box5{
            grid-column:3;
            grid-row: 2;
            background: red;
        }
        .box6{
            grid-column: 1/4;
            grid-row: 4;
            background-color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>
    </div>

</body>
</html>
